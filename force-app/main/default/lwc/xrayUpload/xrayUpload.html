<template>
  <div class={panelCls} aria-hidden={ariaHidden} onkeydown={handleKeydown}>
    <template lwc:if={open}>
      <section
        class="dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="upload-title"
      >
        <header>
          <h2 id="upload-title">Investigate your own org</h2>
          <button class="x" aria-label="Close" onclick={handleClose}>×</button>
        </header>

        <ol class="steps">
          <li>
            <h3>1. Export your metadata with the Salesforce CLI</h3>
            <p>
              Use a sandbox or a dev org. This reads metadata only: no records.
            </p>
            <label class="alias">
              <span>Your org alias</span>
              <input
                type="text"
                value={alias}
                oninput={handleAlias}
                aria-label="Your org alias"
              />
            </label>
            <div class="cmd">
              <textarea
                lwc:ref="command"
                readonly
                rows="4"
                aria-label="Command to run"
                value={command}
              ></textarea>
              <button class="btn" onclick={handleCopy}>{copyLabel}</button>
            </div>
            <p class="note">
              It creates <code>orgxray/orgxray.zip</code> in the folder you run
              it from.
            </p>
          </li>
          <li>
            <h3>2. Choose the zip</h3>
            <div class="drop" ondragover={handleDragOver} ondrop={handleDrop}>
              <p>Drop <code>orgxray.zip</code> here, or</p>
              <input
                type="file"
                accept=".zip"
                onchange={handleFile}
                aria-label="Choose orgxray.zip"
              />
            </div>
            <template lwc:if={status}
              ><p class="status" aria-live="polite">{status}</p></template
            >
            <template lwc:if={error}
              ><p class="error" role="alert">{error}</p></template
            >
            <template lwc:if={hasIndex}>
              <p class="found"><b>Found:</b> {summaryText}</p>
              <template lwc:if={skippedText}
                ><p class="note">{skippedText}</p></template
              >
            </template>
          </li>
          <li>
            <h3>3. Send in the crew</h3>
            <button
              class="btn primary"
              disabled={startDisabled}
              onclick={handleStart}
            >
              ✦ Investigate my org
            </button>
            <template lwc:if={showResting}>
              <p class="error">
                The live AI crew is resting right now. Please try again later.
              </p>
            </template>
          </li>
        </ol>

        <p class="privacy">
          <b>Your data:</b> the zip is read in this browser tab and never
          uploaded or stored. While the crew works, only the pieces it reads are
          sent to the AI, one step at a time, through the Einstein Trust Layer.
          Close the tab and it's gone.
        </p>
      </section>
    </template>
  </div>
</template>
