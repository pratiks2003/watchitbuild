<template>
  <section class="panel" aria-label="Evidence board">
    <div class="ph">
      <span class="t">evidence board</span>
      <span class="n">{countText}</span>
      <span class="spacer"></span>
      <input
        class="filter"
        type="search"
        placeholder="Filter findings"
        aria-label="Filter findings"
        value={filter}
        oninput={handleFilter}
      />
    </div>
    <div class={boardCls} style={boardStyle} lwc:ref="board">
      <div class="strings" lwc:ref="strings" lwc:dom="manual"></div>
      <p class="empty">
        Findings get pinned here as Pip brings them up.<br />Each card shows its
        proof and how sure the crew is.
      </p>

      <template lwc:if={grouped}>
        <div class="cols">
          <template for:each={columns} for:item="col">
            <div class="col" key={col.id}>
              <div class="colh">
                <span>{col.label}</span><span>{col.count}</span>
              </div>
              <template for:each={col.cards} for:item="c">
                <div
                  key={c.id}
                  class={c.cls}
                  data-id={c.id}
                  role="button"
                  tabindex="0"
                  aria-label={c.label}
                  onclick={handleAsk}
                  onkeydown={handleKey}
                >
                  <div class="ty">{c.type}</div>
                  <div class="ti">{c.title}</div>
                  <div class="ev">{c.evidence}</div>
                  <template lwc:if={c.hasSource}
                    ><div class="src">{c.source}</div></template
                  >
                  <div class="ft">
                    <span class="ask">{c.ask}</span
                    ><span class={c.statusCls}>{c.status}</span>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
      <template lwc:else>
        <template for:each={views} for:item="c">
          <div
            key={c.id}
            class={c.cls}
            style={c.style}
            data-id={c.id}
            role="button"
            tabindex="0"
            aria-label={c.label}
            onclick={handleAsk}
            onkeydown={handleKey}
          >
            <div class="ty">{c.type}</div>
            <div class="ti">{c.title}</div>
            <div class="ev">{c.evidence}</div>
            <template lwc:if={c.hasSource}
              ><div class="src">{c.source}</div></template
            >
            <div class="ft">
              <span class="ask">{c.ask}</span
              ><span class={c.statusCls}>{c.status}</span>
            </div>
          </div>
        </template>
      </template>
    </div>
  </section>
</template>
